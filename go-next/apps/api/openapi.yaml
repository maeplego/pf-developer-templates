openapi: 3.0.3
info:
  title: "{{PROJECT}} API"
  version: "1.0.0"
servers:
  - url: http://localhost:{{HTTP_PORT}}
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: liveness
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /ready:
    get:
      operationId: ready
      responses:
        "200":
          description: readiness
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
