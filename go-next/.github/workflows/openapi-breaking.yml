name: oasdiff-breaking

on:
  pull_request:

jobs:
  breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: base spec from target branch
        run: |
          mkdir -p /tmp/oasdiff
          git show "origin/${{ github.base_ref }}:apps/api/openapi.yaml" > /tmp/oasdiff/openapi.yaml
      - uses: oasdiff/oasdiff-action/breaking@v0.1.13
        with:
          base: /tmp/oasdiff/openapi.yaml
          revision: apps/api/openapi.yaml
          fail-on: ERR
